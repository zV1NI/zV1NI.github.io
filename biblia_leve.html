<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia Sagrada Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col justify-between">
    
    <!-- Barra Superior de Navegação -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-10 px-4 py-3 shadow-xs">
        <div class="max-w-xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-lg font-semibold tracking-tight text-stone-900 flex items-center gap-2">
                📖 Bíblia Sagrada 
                <span class="text-xs font-normal bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Completa Offline</span>
            </h1>
            
            <!-- Seletores Interativos -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="livroSelect" onchange="atualizarCapitulos()" 
                    class="bg-stone-50 border border-stone-200 rounded-lg px-3 py-1.5 text-sm text-stone-800 focus:outline-none focus:ring-2 focus:ring-stone-400 flex-1 sm:flex-none">
                    <option>Carregando livros...</option>
                </select>
                <select id="capituloSelect" onchange="carregarTexto()" 
                    class="bg-stone-50 border border-stone-200 rounded-lg px-3 py-1.5 text-sm text-stone-800 focus:outline-none focus:ring-2 focus:ring-stone-400 w-28">
                </select>
            </div>
        </div>
    </header>

    <!-- Área de Leitura -->
    <main class="w-full max-w-xl mx-auto p-4 sm:p-6 my-auto">
        <div id="leitor" class="bg-white shadow-xs rounded-2xl p-6 border border-stone-100 space-y-4">
            <p class="text-center text-stone-400 py-10 text-sm">Carregando banco de dados da Bíblia...</p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center text-xs text-stone-400 py-4 border-t border-stone-100 bg-white">
        Todos os direitos reservados aos textos sagrados • 100% Offline
    </footer>

    <script>
        let bibliaCompleta = {};

        // Carrega o banco de dados JSON local ao iniciar
        async function carregarBancoDeDados() {
            try {
                const resposta = await fetch('biblia.json');
                if (!resposta.ok) throw new Error('Erro ao carregar o arquivo da Bíblia.');
                bibliaCompleta = await resposta.json();
                inicializarSeletores();
            } catch (err) {
                document.getElementById('leitor').innerHTML = `
                    <div class="text-center py-10 text-red-500 text-sm">
                        <p class="font-semibold mb-1">Atenção: Arquivo 'biblia.json' não encontrado!</p>
                        <p class="text-stone-500">Certifique-se de que o arquivo JSON com os dados da Bíblia está na mesma pasta do arquivo index.html.</p>
                    </div>`;
            }
        }

        function inicializarSeletores() {
            const livroSelect = document.getElementById('livroSelect');
            livroSelect.innerHTML = '';
            
            Object.keys(bibliaCompleta).forEach(livro => {
                let opt = document.createElement('option');
                opt.value = livro;
                opt.textContent = livro;
                livroSelect.appendChild(opt);
            });

            atualizarCapitulos();
        }

        function atualizarCapitulos() {
            const livroSelect = document.getElementById('livroSelect');
            const capituloSelect = document.getElementById('capituloSelect');
            const livroEscolhido = livroSelect.value;
            
            capituloSelect.innerHTML = '';
            const capitulosDoLivro = bibliaCompleta[livroEscolhido];

            if (capitulosDoLivro) {
                Object.keys(capitulosDoLivro).forEach(cap => {
                    let opt = document.createElement('option');
                    opt.value = cap;
                    opt.textContent = `Capítulo ${cap}`;
                    capituloSelect.appendChild(opt);
                });
            }

            carregarTexto();
        }

        function carregarTexto() {
            const livro = document.getElementById('livroSelect').value;
            const cap = document.getElementById('capituloSelect').value;
            const leitor = document.getElementById('leitor');

            if (!bibliaCompleta[livro] || !bibliaCompleta[livro][cap]) {
                leitor.innerHTML = `<p class="text-center text-stone-400 py-10">Selecione um capítulo válido.</p>`;
                return;
            }

            let versiculos = bibliaCompleta[livro][cap];

            let html = `<div class="border-b border-stone-100 pb-3 mb-4 flex justify-between items-center">
                <h2 class="text-lg font-medium text-stone-900">${livro} ${cap}</h2>
                <span class="text-xs bg-stone-100 text-stone-500 px-2 py-1 rounded-md">Almeida</span>
            </div>`;

            html += `<div class="space-y-3 text-stone-700 leading-relaxed text-base font-serif">`;
            versiculos.forEach((texto, index) => {
                html += `<p><sup class="text-xs text-stone-400 font-sans mr-1.5 font-semibold">${index + 1}</sup>${texto}</p>`;
            });
            html += `</div>`;

            leitor.innerHTML = html;
        }

        window.onload = carregarBancoDeDados;
    </script>
</body>
</html>
