<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMelody - Top 100</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.08);
            --card-border: #dcdce6; /* Borda visível para o modo claro */
            --primary-color: #ff4757;
            --border-hover: #ff4757;
            --success-color: #4CAF50;
            --overlay-color: rgba(0, 0, 0, 0.6);
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #2a2a2a;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --card-border: transparent; /* Sem borda pesada no modo escuro */
            --primary-color: #ff6b6b;
            --border-hover: #ff6b6b;
            --overlay-color: rgba(0, 0, 0, 0.8);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            box-shadow: 0 4px 6px var(--card-shadow);
            z-index: 100;
        }

        .header { text-align: center; margin-bottom: 15px; }
        h1 { margin: 5px 0; color: var(--primary-color); font-size: 24px; }
        
        .score-board {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px var(--card-shadow);
        }
        
        .score-item span { color: var(--primary-color); }

        #loader {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 18px;
            margin: 20px 0;
            text-align: center;
        }

        .player-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            display: none;
        }
        audio { width: 100%; height: 40px; outline: none; }

        .grid-container {
            display: none;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            transition: opacity 0.3s, filter 0.3s;
            opacity: 0.4;
            filter: grayscale(100%);
            pointer-events: none;
        }

        .column.active {
            opacity: 1;
            filter: grayscale(0%);
            pointer-events: auto;
        }

        .column-header {
            text-align: center;
            font-weight: bold;
            color: var(--text-color);
            padding: 5px;
            border-bottom: 2px solid transparent;
            margin-bottom: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .column.active .column-header {
            opacity: 1;
            border-bottom-color: var(--primary-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid var(--card-border); /* Contorno aplicado para separar no modo claro */
            text-align: center;
            box-shadow: 0 2px 4px var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.1s, border-color 0.2s;
            height: 160px;
        }

        .card:hover { border-color: var(--border-hover); }
        .card:active { transform: scale(0.95); }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background-color: #333;
            border-bottom: 1px solid var(--card-border);
        }

        .card h3 {
            font-size: 12px;
            margin: 5px;
            color: var(--text-color);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            padding: 0 5px;
        }

        .card.correct { border-color: var(--success-color) !important; background-color: rgba(76, 175, 80, 0.1); }
        .card.wrong { border-color: #F44336 !important; animation: shake 0.3s; }
        
        /* MODAL / POPUP */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--overlay-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content { transform: translateY(0); }

        .modal-image {
            width: 100%;
            max-width: 200px;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: none; 
        }

        .modal-icon { font-size: 60px; margin-bottom: 10px; display: none; }
        .modal-title { font-size: 26px; font-weight: bold; margin-bottom: 15px; }
        .modal-subtitle { font-size: 15px; margin-bottom: 5px; color: #888; }
        .modal-anime-name { font-size: 20px; color: var(--text-color); margin-bottom: 25px; font-weight: bold; }
        
        .modal-btn {
            padding: 14px 25px;
            font-size: 17px;
            font-weight: bold;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .modal-btn:hover { background-color: var(--border-hover); opacity: 0.9; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="dark-mode">

    <button id="theme-toggle" onclick="toggleTheme()">☀️</button>

    <div class="header">
        <h1>AniMelody 🎵 Top 100</h1>
        <div class="score-board">
            <div class="score-item">Rodada: <span id="round-display">-</span></div>
            <div class="score-item">Acertos: <span id="score-display">0</span></div>
        </div>
    </div>

    <div id="loader">Preparando a rodada de Aberturas (OP)...</div>

    <div class="player-container" id="player-container">
        <audio id="audio-player" controls controlsList="nodownload noplaybackrate"></audio>
    </div>

    <div class="grid-container" id="main-container">
        <div class="column" id="col-0">
            <div class="column-header">Rodada 1</div>
            <div class="cards-container"></div>
        </div>
        <div class="column" id="col-1">
            <div class="column-header">Rodada 2</div>
            <div class="cards-container"></div>
        </div>
        <div class="column" id="col-2">
            <div class="column-header">Rodada 3</div>
            <div class="cards-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Você Acertou!</div>
            <img class="modal-image" id="modal-image" src="" alt="Capa do Anime">
            <div class="modal-icon" id="modal-icon">🏆</div>
            <div class="modal-subtitle" id="modal-subtitle">A resposta era:</div>
            <div class="modal-anime-name" id="modal-anime-name">Nome do Anime</div>
            <button class="modal-btn" id="modal-btn" onclick="handleModalAction()">Próxima Rodada ➡️</button>
        </div>
    </div>

    <script>
        const top100AnimesList = [
            "Shingeki no Kyojin", "Death Note", "Fullmetal Alchemist: Brotherhood", "One Punch Man", "Sword Art Online", 
            "Boku no Hero Academia", "Kimetsu no Yaiba", "Naruto", "Tokyo Ghoul", "Hunter x Hunter", 
            "Steins;Gate", "Jujutsu Kaisen", "No Game No Life", "Code Geass", "Ansatsu Kyoushitsu", 
            "Toradora", "Mob Psycho 100", "Re:Zero", "One Piece", "Cowboy Bebop", 
            "Bleach", "Neon Genesis Evangelion", "JoJo no Kimyou na Bouken", "Haikyuu", "Kaguya-sama wa Kokurasetai", 
            "KonoSuba", "Fairy Tail", "Psycho-Pass", "Dragon Ball Z", "Akame ga Kill", 
            "Nanatsu no Taizai", "Boku dake ga Inai Machi", "Overlord", "Mirai Nikki", "Tengen Toppa Gurren Lagann", 
            "Kill la Kill", "Ao no Exorcist", "Soul Eater", "Kuroshitsuji", "Angel Beats", 
            "Tokyo Revengers", "Chainsaw Man", "Spy x Family", "Kuroko no Basket", "Gintama", 
            "Hellsing Ultimate", "Death Parade", "Elfen Lied", "Noragami", "Vinland Saga", 
            "Darling in the FranXX", "Dr. Stone", "Fate/Zero", "Black Clover", 
            "Made in Abyss", "Violet Evergarden", "Clannad", "Durarara", "Bakemonogatari", 
            "Log Horizon", "High School DxD", "Guilty Crown", "Hyouka", "Nisekoi", 
            "Bungo Stray Dogs", "Danganronpa", "InuYasha", "Samurai Champloo", "Mahou Shoujo Madoka Magica", 
            "Youjo Senki", "Goblin Slayer", "Kakegurui", "Owari no Seraph", "Nichijou", 
            "K-On", "Lucky Star", "Suzumiya Haruhi no Yuuutsu", "Rurouni Kenshin", "Trigun", 
            "Great Teacher Onizuka", "Hajime no Ippo", "Slam Dunk", "Pokemon", "Digimon Adventure", 
            "Yu-Gi-Oh", "Sailor Moon", "Cardcaptor Sakura", "Dragon Ball", "Saint Seiya", 
            "Yu Yu Hakusho", "Shaman King", "Inazuma Eleven", "Bakugan", "Beyblade", 
            "Fullmetal Alchemist", "Naruto Shippuden", "Dragon Ball Super", "Boruto", "Mushoku Tensei"
        ];

        let currentRound = 0; 
        let score = 0;
        let roundAnswers = []; 
        let modalActionType = "NEXT_ROUND"; 

        const player = document.getElementById("audio-player");
        const scoreDisplay = document.getElementById("score-display");
        const roundDisplay = document.getElementById("round-display");
        
        const loader = document.getElementById("loader");
        const playerContainer = document.getElementById("player-container");
        const mainContainer = document.getElementById("main-container");
        
        const modal = document.getElementById("feedback-modal");
        const modalTitle = document.getElementById("modal-title");
        const modalImage = document.getElementById("modal-image");
        const modalIcon = document.getElementById("modal-icon");
        const modalSubtitle = document.getElementById("modal-subtitle");
        const modalAnimeName = document.getElementById("modal-anime-name");
        const modalBtn = document.getElementById("modal-btn");

        player.addEventListener("timeupdate", () => {
            if (player.currentTime >= 15) {
                player.pause();
                player.currentTime = 0; 
                player.play(); 
            }
        });

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            document.getElementById("theme-toggle").textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
        }

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        async function startNewBoard() {
            loader.style.display = "block";
            loader.textContent = "Preparando a rodada de Aberturas (OP)... ⏳";
            playerContainer.style.display = "none";
            mainContainer.style.display = "none";
            modal.classList.remove("show"); 

            currentRound = 0;
            score = 0;
            roundAnswers = [];
            updateScoreboard();

            for(let i = 0; i < 3; i++) {
                const col = document.getElementById(`col-${i}`);
                col.classList.remove("active");
                col.style.pointerEvents = ""; 
                col.querySelector('.cards-container').innerHTML = "";
            }

            const shuffledNames = shuffleArray([...top100AnimesList]);
            const selectedNames = shuffledNames.slice(0, 15);

            try {
                const fetchPromises = selectedNames.map(name => 
                    fetch(`https://api.animethemes.moe/anime?q=${encodeURIComponent(name)}&include=images,animethemes.animethemeentries.videos.audio&page[size]=1`)
                    .then(res => res.json())
                );
                
                const results = await Promise.all(fetchPromises);
                let loadedAnimes = [];
                
                results.forEach(data => {
                    if(data.anime && data.anime.length > 0) {
                        const anime = data.anime[0];
                        
                        const lowerName = anime.name.toLowerCase();
                        if (lowerName.includes("movie") || lowerName.includes("film") || lowerName.includes("special")) {
                            return; 
                        }

                        const coverImage = anime.images.find(img => img.facet === "Large Cover")?.link || anime.images[0]?.link;
                        let audioLink = "";
                        
                        try { 
                            const ops = anime.animethemes.filter(t => t.type === 'OP');
                            if (ops.length > 0) {
                                audioLink = ops[0].animethemeentries[0].videos[0].link;
                            }
                        } catch(e) {}
                        
                        if(coverImage && audioLink) {
                            loadedAnimes.push({ id: anime.id, title: anime.name, img: coverImage, audio: audioLink });
                        }
                    }
                });

                if(loadedAnimes.length < 12) {
                    throw new Error("Busca insuficiente, tentando novamente.");
                }

                const final12 = loadedAnimes.slice(0, 12);
                const colDatas = [ final12.slice(0, 4), final12.slice(4, 8), final12.slice(8, 12) ];

                colDatas.forEach((animesDaColuna, columnIndex) => {
                    const answerForThisColumn = animesDaColuna[Math.floor(Math.random() * 4)];
                    roundAnswers.push(answerForThisColumn); 

                    const container = document.getElementById(`col-${columnIndex}`).querySelector('.cards-container');
                    
                    animesDaColuna.forEach(anime => {
                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <img src="${anime.img}" alt="${anime.title}" loading="lazy">
                            <h3>${anime.title}</h3>
                        `;
                        card.onclick = () => checkAnswer(anime.id, card, columnIndex);
                        container.appendChild(card);
                    });
                });

                loader.style.display = "none";
                playerContainer.style.display = "block";
                mainContainer.style.display = "flex";
                
                playRound();

            } catch (error) {
                loader.textContent = "Buscando Aberturas (OP) puras... Tentando novamente...";
                setTimeout(startNewBoard, 1500);
            }
        }

        function playRound() {
            updateScoreboard();

            for(let i = 0; i < 3; i++) {
                const col = document.getElementById(`col-${i}`);
                if (i === currentRound) {
                    col.classList.add("active");
                    col.style.pointerEvents = ""; 
                } else {
                    col.classList.remove("active");
                    if (i < currentRound) col.style.pointerEvents = "none";
                }
            }

            const currentAnswer = roundAnswers[currentRound];
            player.src = currentAnswer.audio;
            player.play();
        }

        function checkAnswer(selectedId, cardElement, columnIndex) {
            if (columnIndex !== currentRound) return;

            const currentAnswer = roundAnswers[currentRound];
            const currentColumnElement = document.getElementById(`col-${currentRound}`);
            
            currentColumnElement.style.pointerEvents = "none";
            player.pause(); 

            let isCorrect = selectedId === currentAnswer.id;

            if (isCorrect) {
                score++;
                cardElement.classList.add("correct");
            } else {
                cardElement.classList.add("wrong");
                const allCardsInColumn = currentColumnElement.querySelectorAll('.card');
                allCardsInColumn.forEach(c => {
                    if (c.querySelector('h3').textContent === currentAnswer.title) {
                        c.classList.add("correct");
                    }
                });
            }

            setTimeout(() => { showFeedbackModal(isCorrect, currentAnswer); }, 500);
        }

        function showFeedbackModal(isCorrect, answerObj) {
            modalImage.style.display = "block";
            modalIcon.style.display = "none";
            modalSubtitle.style.display = "block";
            
            modalImage.src = answerObj.img;
            modalAnimeName.textContent = answerObj.title;
            
            if (isCorrect) {
                modalTitle.textContent = "Você Acertou! 🎉";
                modalTitle.style.color = "var(--success-color)";
                modalImage.style.border = "4px solid var(--success-color)";
            } else {
                modalTitle.textContent = "Você Errou! 😢";
                modalTitle.style.color = "#F44336";
                modalImage.style.border = "4px solid #F44336";
            }
            
            if (currentRound === 2) { 
                modalBtn.textContent = "Ver Resultado Final 🏆";
                modalActionType = "SHOW_FINAL";
            } else {
                modalBtn.textContent = "Ir para a Rodada " + (currentRound + 2) + " ➡️";
                modalActionType = "NEXT_ROUND";
            }

            modal.classList.add("show");
        }

        function showFinalResultModal() {
            modalImage.style.display = "none";
            modalIcon.style.display = "block";
            modalSubtitle.style.display = "none";

            modalTitle.textContent = "Fim de Jogo!";
            modalTitle.style.color = "var(--primary-color)";
            
            modalAnimeName.innerHTML = `
                Você acertou <br>
                <span style="font-size: 38px; color: var(--primary-color)">${score} / 3</span><br>
                rodadas!
            `;
            
            modalBtn.textContent = "Jogar Novamente 🔄";
            modalActionType = "RESTART_GAME";
            
            modal.classList.add("show");
        }

        function handleModalAction() {
            modal.classList.remove("show"); 
            
            if (modalActionType === "NEXT_ROUND") {
                currentRound++;
                setTimeout(playRound, 300); 
            } 
            else if (modalActionType === "SHOW_FINAL") {
                currentRound++;
                updateScoreboard();
                setTimeout(showFinalResultModal, 300);
            }
            else if (modalActionType === "RESTART_GAME") {
                setTimeout(startNewBoard, 300);
            }
        }

        function updateScoreboard() {
            scoreDisplay.textContent = score;
            roundDisplay.textContent = Math.min(currentRound + 1, 3) + "/3";
        }

        window.onload = startNewBoard;
    </script>
</body>
</html>
